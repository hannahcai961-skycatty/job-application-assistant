# Job Application Assistant — 岗位状态机
# 前后端 MUST 使用此处定义的状态 ID 与 label

states:
  - id: pending
    label: 待投递
    description: 已录入，尚未投递
    transitions: [applied, rejected]

  - id: applied
    label: 已投递
    description: 已完成投递
    transitions: [interview_pending, interviewing, rejected]

  - id: interview_pending
    label: 待面试
    description: 已约面或等待面试安排
    transitions: [interviewing, rejected]

  - id: interviewing
    label: 面试中
    description: 面试流程进行中
    transitions: [rejected]

  - id: rejected
    label: 已拒
    description: 未通过或主动放弃
    transitions: []

match_thresholds:
  apply: 75
  consider: 60
