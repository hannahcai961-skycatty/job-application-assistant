<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Assistant</title>
  <link rel="stylesheet" href="/static/css/style.css?v=13" />
</head>
<body>
  <header>
    <div>
      <h1>Job Application Assistant</h1>
    </div>
    <nav>
      <button data-panel="dashboard" class="active">仪表盘</button>
      <button data-panel="evaluate">岗位评估</button>
      <button data-panel="tracker">投递表</button>
      <button data-panel="ai">AI 工作台</button>
      <button data-panel="settings">设置</button>
    </nav>
  </header>

  <main>
    <!-- 仪表盘：投递总览 -->
    <section id="panel-dashboard" class="panel active">
      <div id="stat-cards" class="stats"></div>
      <div class="card">
        <h2>全部投递</h2>
        <div id="dash-jobs"></div>
      </div>
    </section>

    <!-- 岗位评估：OCR → 分数+理由 → 可写入投递表 -->
    <section id="panel-evaluate" class="panel">
      <div class="card">
        <h2>1. 截图 OCR</h2>
        <p class="preview">上传岗位截图，或在下方区域按 Ctrl+V 粘贴剪贴板里的截图。</p>
        <input id="eval-file" type="file" accept="image/*" />
        <div id="eval-paste" class="paste-zone" tabindex="0">点击此处后按 Ctrl+V，从剪贴板粘贴截图</div>
        <button class="btn" id="btn-eval-ocr" type="button">识别截图</button>
      </div>
      <div class="card">
        <h2>2. 识别结果</h2>
        <div class="grid-2">
          <div>
            <label>公司</label>
            <input id="eval-company" />
          </div>
          <div>
            <label>岗位</label>
            <input id="eval-position" />
          </div>
        </div>
        <label>链接</label>
        <input id="eval-url" />
        <label>岗位要求</label>
        <textarea id="eval-jd" rows="10" placeholder="OCR 后出现在这里，也可手改"></textarea>
        <button class="btn" id="btn-eval-match" type="button">评估匹配度</button>
      </div>
      <div class="card">
        <h2>3. 分数 + 理由</h2>
        <div class="output" id="eval-output">—</div>
        <div class="row-actions">
          <button class="btn" id="btn-eval-save" type="button">写入投递表</button>
        </div>
      </div>
    </section>

    <!-- 投递表 -->
    <section id="panel-tracker" class="panel">
      <div class="card">
        <h2>投递记录</h2>
        <div class="row-actions" style="margin-bottom:0.75rem">
          <button class="btn" id="btn-add-job" type="button">新增一行</button>
        </div>
        <div class="table-wrap">
          <table class="sheet">
            <thead>
              <tr>
                <th>公司</th>
                <th class="col-position">岗位</th>
                <th>渠道</th>
                <th class="col-status">状态</th>
                <th>投递日</th>
                <th>面试轮次</th>
                <th>备注</th>
                <th>分数</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tracker-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- AI 工作台：仅邮箱话术 -->
    <section id="panel-ai" class="panel">
      <div class="card notice">
        <strong>人工核对后再发送。</strong>本工具不会自动发邮件。
      </div>
      <div class="card">
        <h2>JD 来源</h2>
        <label>从投递表读取</label>
        <select id="ai-job">
          <option value="">不从投递表读取</option>
        </select>
        <label>或粘贴 JD</label>
        <textarea id="ai-jd" rows="8" placeholder="粘贴岗位描述…"></textarea>
        <label>或 OCR 截图（可粘贴）</label>
        <input id="ai-file" type="file" accept="image/*" />
        <div id="ai-paste" class="paste-zone" tabindex="0">点击此处后按 Ctrl+V，从剪贴板粘贴截图</div>
        <button class="btn btn-secondary" id="btn-ai-ocr" type="button">识别到 JD 框</button>
        <label>收件人称呼</label>
        <input id="ai-recipient" placeholder="招聘负责人" />
        <button class="btn" id="btn-email" type="button">生成邮箱话术</button>
      </div>
      <div class="card">
        <h2>邮箱话术 <button class="btn btn-secondary" data-copy="output-email" type="button">复制</button></h2>
        <div class="output" id="output-email">—</div>
      </div>
    </section>

    <!-- 设置 -->
    <section id="panel-settings" class="panel">
      <div class="card">
        <h2>AI 配置</h2>
        <p>API Key 状态：<strong id="settings-key-status">—</strong></p>
        <form id="form-settings">
          <div class="field-grid">
            <div>
              <label>API Key</label>
              <input name="api_key" type="password" autocomplete="off" />
            </div>
            <div>
              <label>Base URL</label>
              <input name="base_url" id="settings-base-url" />
            </div>
            <div>
              <label>模型名称</label>
              <input name="model" id="settings-model" />
            </div>
          </div>
          <label>个人材料</label>
          <div class="field-grid">
            <div>
              <label>主题</label>
              <input id="profile-topic" />
            </div>
            <div>
              <label>文件</label>
              <input id="profile-file" type="file" multiple accept=".pdf,.docx,.txt,.md,.markdown,.prd,application/pdf" />
            </div>
          </div>
          <button class="btn btn-secondary" id="btn-profile" type="button">上传材料</button>
          <div id="profile-list" style="margin-top:1rem"></div>
          <button type="submit" class="btn">保存设置</button>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/static/js/app.js?v=15"></script>
</body>
</html>
